name = "partsharbor-admin"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "partsharbor-admin"
# Replace after: wrangler d1 create partsharbor-admin
database_id = "7ea51d9d-da72-4cf0-90e6-b5edda52d20a"

[assets]
directory = "./public"
binding = "ASSETS"
# Do not use `/admin/*` here — `/admin/static/*` must be served from Workers Assets.
run_worker_first = [
  "/admin/login",
  "/admin/logout",
  "/admin",
  "/admin/assemblyedge",
  "/admin/assemblyedge/*",
  "/admin/majorityiq",
  "/admin/majorityiq/*",
  "/healthz",
  "/",
]

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "development"
ARGON2_MEMORY_KIB = "8192"
ARGON2_PASSES = "2"
ARGON2_PARALLELISM = "1"
SESSION_MAX_AGE_SEC = "28800"
# MajorityIQ Ask the desk — Workers AI on free daily allocation (set false to disable)
ASSEMBLYEDGE_ASK_AI = "true"
ASSEMBLYEDGE_ASK_AI_DAILY_LIMIT = "30"
# ASSEMBLYEDGE_ASK_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"

# Secrets (wrangler secret put SESSION_SECRET):
# SESSION_SECRET — session signing + CSRF (≥32 chars)
