<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <rect width="600" height="800" fill="#fff"/>
  <!-- 3x10 grid of mini labels -->
  <g font-family="Arial, sans-serif" font-size="5" fill="#000">
    <!-- Row 1 -->
    <g transform="translate(10,10)"><rect width="185" height="72" fill="#fff" stroke="#ccc" stroke-width="0.5"/><polygon points="5,8 15,24 5,24" fill="#f5c518" stroke="#000" stroke-width="0.5"/><text x="18" y="14" font-size="6" font-weight="bold">WARNING:</text><text x="5" y="28" font-size="4.5">Handling passenger or off-highway motor vehicle parts...</text></g>
    <g transform="translate(205,10)"><rect width="185" height="72" fill="#fff" stroke="#ccc" stroke-width="0.5"/><polygon points="5,8 15,24 5,24" fill="#f5c518" stroke="#000" stroke-width="0.5"/><text x="18" y="14" font-size="6" font-weight="bold">WARNING:</text><text x="5" y="28" font-size="4.5">Handling passenger or off-highway motor vehicle parts...</text></g>
    <g transform="translate(400,10)"><rect width="185" height="72" fill="#fff" stroke="#ccc" stroke-width="0.5"/><polygon points="5,8 15,24 5,24" fill="#f5c518" stroke="#000" stroke-width="0.5"/><text x="18" y="14" font-size="6" font-weight="bold">WARNING:</text><text x="5" y="28" font-size="4.5">Handling passenger or off-highway motor vehicle parts...</text></g>
    <!-- Rows 2-10 simplified -->
    <g transform="translate(10,90)"><rect width="185" height="72" fill="#fff" stroke="#ccc" stroke-width="0.5"/><polygon points="5,8 15,24 5,24" fill="#f5c518" stroke="#000" stroke-width="0.5"/><text x="18" y="14" font-size="6" font-weight="bold">WARNING:</text><text x="5" y="28" font-size="4.5">Handling passenger or off-highway motor vehicle parts...</text></g>
    <g transform="translate(205,90)"><rect width="185" height="72" fill="#fff" stroke="#ccc" stroke-width="0.5"/><polygon points="5,8 15,24 5,24" fill="#f5c518" stroke="#000" stroke-width="0.5"/><text x="18" y="14" font-size="6" font-weight="bold">WARNING:</text><text x="5" y="28" font-size="4.5">Handling passenger or off-highway motor vehicle parts...</text></g>
    <g transform="translate(400,90)"><rect width="185" height="72" fill="#fff" stroke="#ccc" stroke-width="0.5"/><polygon points="5,8 15,24 5,24" fill="#f5c518" stroke="#000" stroke-width="0.5"/><text x="18" y="14" font-size="6" font-weight="bold">WARNING:</text><text x="5" y="28" font-size="4.5">Handling passenger or off-highway motor vehicle parts...</text></g>
    <!-- Pattern fill for remaining rows -->
    <g opacity="0.9">
      <rect x="10" y="170" width="575" height="620" fill="url(#labelPattern)" stroke="#ddd" stroke-width="0.5"/>
    </g>
  </g>
  <defs>
    <pattern id="labelPattern" width="195" height="78" patternUnits="userSpaceOnUse">
      <rect width="185" height="72" x="5" y="3" fill="#fff" stroke="#ccc" stroke-width="0.5"/>
      <polygon points="10,11 20,27 10,27" fill="#f5c518" stroke="#000" stroke-width="0.5"/>
      <text x="23" y="17" font-family="Arial" font-size="6" font-weight="bold">WARNING:</text>
    </pattern>
  </defs>
  <text x="300" y="790" text-anchor="middle" font-family="Arial" font-size="8" fill="#999">English labels sheet  Avery-style layout (30 labels)</text>
</svg>
